# Compila el APK de prueba (depuración) en cada push a main y a mano desde Actions.
# El APK queda como artefacto «mobile-coder-debug» de cada ejecución: se descarga, se descomprime y se instala.
name: APK de prueba

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Las copias del editor y de Pyodide siguen idénticas a sus manifiestos, y los scripts de la app se analizan.
      - name: Comprobar web/
        run: node herramientas/verificar.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-coder-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
