# Compila el APK de prueba (depuración) en cada push a main y a mano desde Actions.
# El APK queda como artefacto «mobile-coder-debug» de cada ejecución: se descarga, se descomprime y se instala.
name: APK de prueba

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # para publicar el APK en la release «prueba»

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Las copias del editor, de Pyodide y de los servicios de lenguaje siguen idénticas a sus manifiestos, y los scripts de la app se analizan.
      - name: Comprobar web/
        run: node herramientas/verificar.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: ./gradlew --no-daemon assembleDebug

      # Lo que lleva el APK, en el registro: paquete, SDK, permisos y los activos que la app necesita sin conexión.
      - name: Revisar el APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission|application-label|launchable-activity)"
          for f in assets/index.html assets/app/motor-js.js assets/app/motor-python.js assets/cmg/ORIGEN.json \
                   assets/vendor/pyodide/pyodide.mjs assets/vendor/pyodide/pyodide.asm.mjs assets/vendor/pyodide/pyodide.asm.wasm \
                   assets/vendor/pyodide/python_stdlib.zip assets/app/lenguaje-web.js assets/app/lenguaje-python.js \
                   assets/vendor/typescript/typescript.js assets/vendor/typescript/lib/lib.dom.d.ts \
                   assets/vendor/servicios-web/servicios-web.js assets/vendor/jedi/jedi-0.19.2-py2.py3-none-any.whl; do
            unzip -l "$APK" "$f" | grep -q "$f" && echo "ok  $f" || { echo "FALTA $f"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-coder-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Enlace fijo para el teléfono, sin zip ni sesión de GitHub (si el repositorio es público):
      # https://github.com/<repo>/releases/download/prueba/mobile-coder.apk. Cada push a main lo reemplaza.
      - name: Publicar en la release «prueba»
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk mobile-coder.apk
          NOTAS="APK de prueba (depuración) de ${GITHUB_SHA::7}. Se reemplaza en cada push a main."
          # La API de releases a veces responde 500: se reintenta.
          publicar() {
            if gh release view prueba >/dev/null 2>&1; then
              gh release upload prueba mobile-coder.apk --clobber && gh release edit prueba --notes "$NOTAS"
            else
              gh release create prueba mobile-coder.apk --prerelease --title "APK de prueba" --notes "$NOTAS" --target "$GITHUB_SHA"
            fi
          }
          for i in 1 2 3 4; do publicar && exit 0; echo "Reintento $i…"; sleep $((i * 10)); done
          exit 1
